server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/recipes;
        # Rewrite /api/recipes to /recipes if needed, but backend expects /recipes
        # Actually, if frontend calls /api/recipes, and we proxy to http://backend:8000/recipes, 
        # then we need to strip /api or match correctly.
        # If frontend calls /api/recipes, and we want to hit http://backend:8000/recipes
        # rewrite ^/api/(.*) /$1 break;
        rewrite ^/api/(.*) /$1 break;
    }
}
