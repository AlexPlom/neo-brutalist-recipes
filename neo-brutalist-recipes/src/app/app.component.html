<div class="app-shell">
  <header class="app-header">
    <div class="header-start">
      <button class="app-logo" type="button" (click)="cycleTheme($event)">
        <span class="logo-mark">NB</span>
        <span class="logo-text">Neo Brutalist Kitchen</span>
      </button>

      <button class="country-toggle" type="button" (click)="countryService.toggleCountry()"
        [attr.aria-label]="countryService.selectedCountry() === 'BG' ? 'Switch to Greek recipes' : 'Switch to Bulgarian recipes'">
        <span class="country-toggle__flag">{{ countryService.selectedCountry() === 'BG' ? '🇧🇬' : '🇬🇷' }}</span>
      </button>
    </div>
  </header>

  <main>
    <router-outlet />
  </main>

  <footer class="app-footer">
    <b>Life over Profit © 2025&nbsp;</b>
  </footer>
</div>
