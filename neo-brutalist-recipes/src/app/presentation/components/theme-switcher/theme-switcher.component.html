<div class="theme-switcher" role="group" aria-label="Theme selection">
  <button
    *ngFor="let theme of themes(); trackBy: trackByTheme"
    type="button"
    class="theme-switcher__option"
    [class.theme-switcher__option--active]="isActive(theme.id)"
    (click)="selectTheme(theme.id)"
    [attr.aria-pressed]="isActive(theme.id)"
  >
    <span
      class="theme-switcher__swatch"
      [style.background]="
        'linear-gradient(135deg, ' +
        theme.preview.primary +
        ' 0%, ' +
        theme.preview.secondary +
        ' 100%)'
      "
    ></span>
    <span class="theme-switcher__label">{{ theme.name }}</span>
  </button>
</div>
