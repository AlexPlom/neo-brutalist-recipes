version: "3.9"

services:
  db:
    image: postgres:16
    command: -p 5435
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
    ports:
      - "5435:5435"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes -p 5435"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - recipes-data:/var/lib/postgresql/data

  recipes-api:
    build: .
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg2://recipes:recipes@db:5435/recipes
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  recipes-data:
