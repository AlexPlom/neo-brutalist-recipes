version: "3.9"

services:
  db:
    image: postgres:16
    command: -p 5435
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
    ports:
      - "5435:5435"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes -p 5435"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    volumes:
      - recipes-data:/var/lib/postgresql/data

  recipes-api:
    build: .
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg2://recipes:recipes@db:5435/recipes
    ports:
      - "8000:8000"
    labels:
    - traefik.enable=true
    - traefik.docker.network=proxy

    # Root domain → recipes
    - traefik.http.routers.recipes.rule=Host(`zeroeighty.cloud`)
    - traefik.http.routers.recipes.entrypoints=web,websecure
    - traefik.http.routers.recipes.tls=true
    - traefik.http.routers.recipes.tls.certresolver=mytlschallenge

    # Map to internal port
    - traefik.http.services.recipes.loadbalancer.server.port=8000
    networks:
      - proxy
      - internal 
    depends_on:
      db:
        condition: service_healthy

networks:
  internal:
    driver: bridge
  proxy:
    external: true

volumes:
  recipes-data:
